name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest
    env:
      # Placeholder only — Prisma generate / Next build do not open a live DB.
      # Runtime uses Neon via DATABASE_URL in your host / container env.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-better-auth-secret-32-chars-min
      GITHUB_CLIENT_ID: ci-github-client
      GITHUB_CLIENT_SECRET: ci-github-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config

      - name: Build image
        run: docker build -t flowai:ci .
