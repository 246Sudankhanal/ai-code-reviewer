services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sudan
      POSTGRES_PASSWORD: sudan
      POSTGRES_DB: sudan_review
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudan -d sudan_review"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    image: sudan-review:local
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://sudan:sudan@postgres:5432/sudan_review
      RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
