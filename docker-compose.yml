services:
  app:
    build:
      context: .
    image: ghcr.io/246sudankhanal/ai-code-reviewer:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      RUN_MIGRATIONS: "true"
